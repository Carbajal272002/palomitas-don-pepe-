<!-- SCRIPTS -->
    <script>
        function cambiarVista(nombreVista) {
            // Oculta todas las secciones
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            
            // Muestra la sección a la que le diste clic
            const vistaActiva = document.getElementById(`vista-${nombreVista}`);
            if (vistaActiva) {
                vistaActiva.classList.remove('hidden');
            }
            
            // Regresa la pantalla hacia arriba
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Control del menú en celulares
        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }
        document.getElementById('mobile-menu-btn').addEventListener('click', toggleMobileMenu);

        // Envío de WhatsApp
        function enviarWhatsApp(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const tipo = document.getElementById('tipo-evento').value;
            const invitados = document.getElementById('invitados').value;
            const detalles = document.getElementById('detalles').value;

            const mensaje = `¡Hola! Me gustaría cotizar un pedido de palomitas.%0A%0A*Nombre:* ${nombre}%0A*Teléfono:* ${telefono}%0A*Tipo de Evento:* ${tipo}%0A*Invitados:* ${invitados}%0A*Sabores:* ${detalles}`;
            window.open(`https://wa.me/5215539494722?text=${mensaje}`, '_blank');
        }
    </script>
</body>
</html>
